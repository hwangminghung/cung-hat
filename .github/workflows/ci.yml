name: CI
on: [push, pull_request]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.109.1 }
      - run: supabase db start
      - run: supabase test db

  # [AUDIT M5] Edge functions (payments/IAP) truoc day khong co check nao trong
  # CI — deno check bat loi type/import truoc khi len prod.
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts
      # Edge function truoc day chi duoc type-check. sms.ts co nhanh
      # fail-closed/timeout khong the bat bang type -> chay test that.
      - run: deno test supabase/functions/_shared/
