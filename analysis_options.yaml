include: package:flutter_lints/flutter.yaml
analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # build/ is gitignored scratch (design-handoff exports land here); it is not
    # app source and its snippets do not resolve against lib/.
    - "build/**"
linter:
  rules:
    prefer_const_constructors: true
    require_trailing_commas: true
